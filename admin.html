<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

body{
font-family:Arial;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#222;
padding:20px;
border-radius:10px;
width:300px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:green;
color:white;
border:none;
border-radius:5px;
font-size:16px;
}

h2{
color:white;
text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input
type="password"
id="pass"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<div id="panel" style="display:none;">

<input
type="text"
id="whatsapp"
placeholder="WhatsApp Number">

<button onclick="save()">
Save Number
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyDWpBjTpzXjQMnmlguHTSxcA10LavCp8rU",

authDomain: "kerala-lottery-v4.firebaseapp.com",

databaseURL: "https://kerala-lottery-v4-default-rtdb.firebaseio.com",

projectId: "kerala-lottery-v4",

storageBucket: "kerala-lottery-v4.firebasestorage.app",

messagingSenderId: "731675660917",

appId: "1:731675660917:web:2ac0b5b4837ae757751e3c",

measurementId: "G-0NEWDPJ1J1"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window.login = function(){

const pass =
document.getElementById("pass").value;

if(pass === "12345"){

document.getElementById("panel").style.display = "block";

}else{

alert("Wrong Password");

}

}

window.save = async function(){

  const whatsapp =
  document.getElementById("whatsapp").value;

  try {
    await set(ref(db,"site"),{
      whatsapp: whatsapp
    });

    alert("WhatsApp Updated Successfully");

  } catch(error) {

    alert("Error: " + error.message);
    console.log(error);

  }
}

</script>

</body>
</html>
